# Aplica las migraciones pendientes cuando llegan a main.
#
# Solo corre si el push trae cambios en supabase/migrations/, y solo aplica
# las que no están en `omtana_schema_migrations`: correrlo dos veces no hace
# nada la segunda. Cada migración va en su propia transacción junto con su
# registro, así que una que falla no queda a medias ni anotada (y el job
# falla, con el error en el log y en el resumen de la corrida).
#
# Corre en el environment `produccion`: si en Settings → Environments le pones
# "Required reviewers", cada corrida espera tu aprobación antes de tocar la
# base. El proyecto de Supabase es compartido con otras apps, así que conviene.
#
# Secreto: SUPABASE_DB_URL con la URI del **Session pooler** de Supabase
# (botón Connect del proyecto → Session pooler). La
# conexión directa (db.<ref>.supabase.co) es solo IPv6 —salvo con el add-on
# IPv4— y los runners de GitHub son solo IPv4. El Transaction pooler (puerto
# 6543) es para tráfico corto de serverless, no para migraciones.
#
# Localmente es exactamente lo mismo:
#   npm run db:migrate -- --seco     (dice qué aplicaría)
#   npm run db:migrate
name: Migraciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      seco:
        description: "Solo decir qué aplicaría"
        type: boolean
        default: false

# Nunca dos a la vez sobre la misma base (además del candado en Postgres).
concurrency:
  group: migraciones
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # El runner trae el cliente de Postgres; por si una imagen nueva no.
      - name: psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Aplicar lo pendiente
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate -- ${{ inputs.seco == true && '--seco' || '' }}
